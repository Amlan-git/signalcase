[project]
name = "signalcase"
version = "0.1.0"
description = "Turn customer conversations into verified product evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
  "jsonschema[format-nongpl]>=4.23,<5",
  "pydantic>=2.10,<3",
  "strands-agents>=1,<2",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.35,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/contracts/python/signalcase_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/signalcase.schema.json" = "signalcase_contracts/signalcase.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/contracts/signalcase.schema.json",
  "/packages/contracts/python/signalcase_contracts",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["signalcase_contracts"]
mypy_path = "packages/contracts/python"

[tool.datamodel-codegen]
input = "contracts/signalcase.schema.json"
input-file-type = "jsonschema"
output = "packages/contracts/python/signalcase_contracts/models.py"
output-model-type = "pydantic_v2.BaseModel"
class-name = "SignalCaseFixtureBundle"
target-python-version = "3.12"
target-pydantic-version = "2.12"
output-datetime-class = "AwareDatetime"
extra-fields = "forbid"
disable-timestamp = true
enable-generated-header-marker = true
allow-remote-refs = false
strict-refs = true
collapse-root-models = true
field-constraints = true
use-annotated = true
use-standard-collections = true
use-union-operator = true
enum-field-as-literal = "all"
formatters = ["ruff-check", "ruff-format"]
