name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install uv==0.12.13
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Validate Python behavior
        run: uv run pytest
      - name: Check Python lint
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Check Python types
        run: uv run mypy packages/contracts/python/signalcase_contracts
      - name: Check generated Python contracts
        run: uv run datamodel-codegen --check
      - name: Build shared Python package
        run: uv build

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Validate Node behavior
        run: npm test
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Check Node lint
        run: npm run lint
      - name: Check generated TypeScript contracts
        run: npm run contracts:check
